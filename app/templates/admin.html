<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Add Product</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Admin Product Service</h1>
      <p>Only admin can add products. Use admin token (default: admin123 unless changed in ADMIN_TOKEN).</p>
      <p><a href="/">Back to Storefront</a></p>

      <section class="card">
        <h2>Add Product (Admin Only)</h2>
        <form id="admin-product-form">
          <input name="token" type="password" placeholder="Admin token" value="admin123" required />
          <input name="name" placeholder="Product name" required />
          <input name="description" placeholder="Description" required />
          <input name="price" type="number" min="0" step="0.01" placeholder="Price" required />
          <button type="submit">Create Product</button>
        </form>
        <p id="admin-status"></p>
      </section>
    </main>

    <script src="/static/admin.js"></script>
  </body>
</html>
